<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almaceb RED - Negocios destacados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="topbar">
    <div class="logo">
        <span class="logo-main">Almaceb</span>
        <span class="logo-red">RED</span>
        <span class="logo-icon">🌎</span>
    </div>

    <button class="btn-volver">Volver</button>

    <div class="user-icon" aria-label="Perfil">
        <div class="user-head"></div>
        <div class="user-body"></div>
    </div>
</header>

<main class="container">

    <section class="featured">
        <div class="title-row">
            <span class="star">★</span>
            <div>
                <h1>Negocios destacados</h1>
                <p>Descubre los negocios mejor valorados y más populares de la comunidad.</p>
            </div>
        </div>

        <div class="categories">
            <button class="category active">▦ <span>Todos</span></button>
            <button class="category">◉ <span>Panadería</span></button>
            <button class="category">▰ <span>Pastelería</span></button>
            <button class="category">▣ <span>Almacén</span></button>
            <button class="category">☕ <span>Cafetería</span></button>
            <button class="category">♜ <span>Verdulería</span></button>
            <button class="category">••• <span>Otras</span></button>
        </div>
    </section>

    <div class="sort-row">
        <strong>Ordenar por:</strong>
        <button class="sort-button">☆ <span>Valoración</span> <b>⌄</b></button>
    </div>

    <section class="business-grid">

        <article class="business-card">
            <div class="business-image">
                <img src="{{ url_for('static', filename='imgs/negocio-ejemplo.jpg') }}" alt="">
                <span class="rank rank-1">1</span>
                <div class="profile">
                    <div class="profile-head"></div>
                    <div class="profile-body"></div>
                </div>
            </div>
            <div class="card-content">
                <h2>( Nombre Negocio)</h2>
                <div class="rating"><span>★★★★★</span><strong>4.6</strong></div>
            </div>
        </article>

        <article class="business-card">
            <div class="business-image">
                <img src="{{ url_for('static', filename='imgs/negocio-ejemplo.jpg') }}" alt="">
                <span class="rank rank-2">2</span>
                <div class="profile">
                    <div class="profile-head"></div>
                    <div class="profile-body"></div>
                </div>
            </div>
            <div class="card-content">
                <h2>( Nombre Negocio)</h2>
                <div class="rating"><span>★★★★★</span><strong>4.6</strong></div>
            </div>
        </article>

        <article class="business-card">
            <div class="business-image">
                <img src="{{ url_for('static', filename='imgs/negocio-ejemplo.jpg') }}" alt="">
                <span class="rank rank-3">3</span>
                <div class="profile">
                    <div class="profile-head"></div>
                    <div class="profile-body"></div>
                </div>
            </div>
            <div class="card-content">
                <h2>( Nombre Negocio)</h2>
                <div class="rating"><span>★★★★★</span><strong>4.6</strong></div>
            </div>
        </article>

    </section>
</main>

</body>
</html>
