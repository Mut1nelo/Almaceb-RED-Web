<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Compatibilidad -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icono -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imgs/favicon.ico') }}">
    <!-- Estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Título -->
    <title>Función futura | Almaceb RED</title>
    <style>
        h1 {
            color: #ffffff;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            text-align: center;
        }
        main {
            background: linear-gradient(to bottom, #00bf80, #ffffff);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        #future-card {
            max-width: 600px;
            text-align: center;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>
    <main>
        <img
            src="{{ url_for('static', filename='imgs/logo/Almaceb-Logo-inicio.png') }}"
            alt="Almaceb RED Logo"
            width="400"
            >
            <h1>¡Ups! Encontraste una función futura</h1>
            <section id="future-card" class="border-card">
                <h2 class="green-line">Está función estará disponible próximamente</h2>
                <p>Almaceb RED se encuentra actualmente en una versión MVP (Producto Mínimo Viable).
                    Algunas funciones avanzadas serán incorporadas en futuras versiones del proyecto.
                </p>
                <p>Gracias por probar Almaceb RED.</p>
            </section>
            <section>
                <button onclick="history.back()" class="white-btn">Volver atrás</button>
                <a href="/Mapa" class="green-btn">Volver al mapa</a>
            </section>
    </main>
</body>
</html>
