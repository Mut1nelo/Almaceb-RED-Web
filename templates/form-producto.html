<h1>Agregar producto a {{ negocio.nombre_negocio }}</h1>
<form method="POST" enctype="multipart/form-data">
    <div class="form-group">
        <label for="nombre_producto">Nombre del producto</label><br>
        <input type="text" id="nombre_producto" name="nombre_producto" required>
    </div>
    <div class="form-group">
        <label for="precio">Precio</label><br>
        <input type="number" id="precio" name="precio" step="0.01" min="0" required>
    </div>
    <div class="form-group">
        <label for="descripcion">Descripción</label><br>
        <textarea id="descripcion" name="descripcion" rows="3"></textarea>
    </div>
    <div class="form-group">
        <label for="imagen">Imagen del producto</label><br>
        <input type="file" id="imagen" name="imagen" accept="image/png, image/jpeg, image/webp">
    </div>
    <button type="submit" class="green-btn">Agregar producto</button>
</form>
