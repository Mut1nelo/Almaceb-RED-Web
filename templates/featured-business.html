<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Compatibilidad -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icono -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imgs/favicon.ico') }}">
    <!-- Estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Titulo -->
    <title>Negocios Destacados | Almaceb RED</title>
</head>
<body data-account-type="{{ account_type }}" class="bgGrey">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebarPanel" class="sidebarPanel" aria-hidden="true">
        <div class="sidebar-topbar">
            <button id="closeSidebar" class="sidebar-close" type="button" aria-label="Cerrar menú">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <!-- Por ahora no funciona en otras páginas que no sea el mapa -->
    </aside>

    <nav class="nav-container">
        <a href="/">
            <img 
            src="{{ url_for('static', filename='imgs/logo/Almaceb-Logo-inicio.png') }}"
            alt="Almaceb RED Logo"
            class="nav-logo"
            >
        </a>
        <div class="nav-back-container">
            <button class="green-btn back-button" type="button">
                <i class="fa-solid fa-arrow-left"></i>
                Volver
            </button>
        </div>
        <button class="sidebar-toggle" type="button" aria-label="Abrir menú" aria-controls="sidebarPanel" aria-expanded="false">
            <img
            src="{{ url_for('static', filename='imgs/default.jpg') }}"
            alt="Abrir menú de usuario"
            class="nav-profile">
        </button>
    </nav>
    <!-- Contenido -->
    <main>
        <header id="featured-header" class="border-card">
            <h1><i class="bi bi-star-fill" style="color: var(--yellow);"></i> Negocios destacados</h1>
            <p>Descubre los negocios mejor valorados y más populares de la comunidad.</p>
            <div id="featured-filters">
                <button class="nav-btn">
                    <i class="bi bi-list-ul"></i>
                    Todos
                </button>
                <button class="nav-btn">
                    <span class="svg bread-icon"></span>
                    Panadería
                </button>
                <button class="nav-btn">
                    <i class="bi bi-cake2-fill"></i>
                    Pastelería
                </button>
                <button class="nav-btn">
                    <span class="svg almacen-icon"></span>
                    Almacén
                </button>
                <button class="nav-btn">
                    <i class="bi bi-cup-hot-fill"></i>
                    Cafetería
                </button>
                <button class="nav-btn">
                    <span class="svg vegetable-icon"></span>
                    Verdulería
                </button>
                <button class="nav-btn">
                    <i class="bi bi-three-dots"></i>
                    Otras
                </button>
            </div>
        </header>
        <span id="middle-order">
            <p class="white-label">Ordenar por:</p>
            <select name="" id="" class="order">
                <option value="">
                    <i class="bi bi-star"></i> Valoración
                </option>
            </select>
        </span>
        <section id="featured-card-container">
            <article class="featured-card">
                <div class="featured-image">
                    <img
                    src="{{ url_for('static', filename='imgs/img-proto.png') }}"
                    alt=""
                    class="featured-banner"
                    >
                    <span class="rank rank-1">1</span>
                </div>
                <div class="featured-card-content">
                    <img
                    src="{{ url_for('static', filename='imgs/default.jpg') }}"
                    alt=""
                    class="featured-profile"
                    >
                    <h2>( Nombre Negocio)</h2>
                    <div class="rating"><span>★★★★★</span><strong>4.6</strong></div>
                    <label for="" class="green-label">(Tipo)</label><br>
                    <span>
                        <i class="bi bi-geo-alt-fill"></i>
                        <h3>(Ubicación)</h3>
                    </span>
                </div>
            </article>
        </section>
    </main>
    <!-- Footer -->
    <footer class="web-footer">
        <div class="footer-brand">
            <img src="{{ url_for('static', filename='imgs/logo/Almaceb-HD-Logo.png') }}" alt="Almaceb RED Logo">
            <p>Conectando negocios de barrio con clientes reales.</p>
        </div>
        <div class="footer-column">
            <h4>Enlaces</h4>
            <a href="/">Inicio</a>
        </div>
        <div class="footer-column">
            <h4>Proyecto</h4>
            <p>IntelliRED SpA</p>
            <p>Feria Técnico Profesional 2026</p>
            <p>© 2026 Almaceb RED</p>
        </div>
    </footer>
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
