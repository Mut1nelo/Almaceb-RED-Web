<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <style>
        .campo { margin-bottom: 15px; }
        input { padding: 6px; width: 280px; }
        button { padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        /* Clases CSS explícitas para evitar poner condicionales inline de Jinja */
        .msg-success { color: green; font-weight: bold; }
        .msg-danger { color: red; font-weight: bold; }
        .msg-warning { color: orange; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Formulario de Registro</h2>
    
    <!-- Bloque de alertas corregido -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p class="msg-{{ category }}">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/registro" method="POST">
        <div class="campo">
            <input type="text" name="username" placeholder="Usuario" required>
        </div>
        <div class="campo">
            <input type="password" name="password" placeholder="Contraseña" required>
        </div>
        <div class="campo">
            <label for="direccion">Dirección de residencia:</label><br>
            <input type="text" id="direccion" name="direccion" placeholder="Ej: Anibal Zañartu 9771, San Ramon" required>
        </div>

        <button type="submit">Registrarse</button>
    </form>
    
    <br>
    <a href="/">Volver al Login</a>
</body>
</html>
