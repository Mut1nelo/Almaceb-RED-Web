<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
</head>
<body>

<div id="info-container">

    <div class="h2-titles">
        <h2>Información sobre Vendedor/a</h2>
    </div>
    {% for usuario in usuarios %}
    <div class="box-info">
        <h3>Vendedor/a</h3>
        <div class="info">
            <img src="{{ url_for('static', filename='imgs/pfps/unk.jpg') }}" height="100px">
            <div class="vendedor-detalles">
                <h3>{{ usuario.nombre }}</h3>
            </div>
        </div>
        <h3>Atiende</h3>
        <p>Desde {{ usuario.horario_apertura }} hasta {{ usuario.horario_cierre }}</p>
        <h3>Descripción:</h3>
        <p>{{ usuario.descripcion }}</p> 
    {% endfor %}      
    </div>
</div>

</body>
</html>
