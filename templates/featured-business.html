<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Compatibilidad -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icono -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imgs/favicon.ico') }}">
    <!-- Estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Título -->
    <title>Negocios destacados | Almaceb RED</title>
</head>
<body class="bgGrey">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebarPanel" class="sidebarPanel" aria-hidden="true">
        <div class="sidebar-topbar">
            <button id="closeSidebar" class="sidebar-close" type="button" aria-label="Cerrar menú">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Estructura reservada para la futura integración del menú lateral. -->
    </aside>

    <nav class="nav-container">
        <a href="/">
            <img 
            src="{{ url_for('static', filename='imgs/logo/Almaceb-Logo-inicio.png') }}"
            alt="Almaceb RED Logo"
            class="nav-logo"
            >
        </a>
        <div class="nav-back-container">
            <button class="green-btn back-button" type="button">
                <i class="fa-solid fa-arrow-left"></i>
                Volver
            </button>
        </div>
        <button class="sidebar-toggle" type="button" aria-label="Abrir menú" aria-controls="sidebarPanel" aria-expanded="false">
            <img
            src="{{ url_for('static', filename='imgs/default.jpg') }}"
            alt="Abrir menú de usuario"
            class="nav-profile">
        </button>
    </nav>
    <!-- Contenido -->
    <main class="featured-business-page">
        <header id="featured-header" class="border-card">
            <h1><i class="bi bi-star-fill featured-heading-icon" aria-hidden="true"></i> Negocios destacados</h1>
            <p>Descubre los negocios mejor valorados y más populares de la comunidad.</p>
            <div id="featured-filters" role="group" aria-label="Filtros de categoría">
                <button class="nav-btn featured-filter is-active" type="button">
                    <i class="bi bi-list-ul"></i>
                    Todos
                </button>
                <button class="nav-btn featured-filter" type="button">
                    <span class="svg bread-icon"></span>
                    Panadería
                </button>
                <button class="nav-btn featured-filter" type="button">
                    <i class="bi bi-cake2-fill"></i>
                    Pastelería
                </button>
                <button class="nav-btn featured-filter" type="button">
                    <span class="svg almacen-icon"></span>
                    Almacén
                </button>
                <button class="nav-btn featured-filter" type="button">
                    <i class="bi bi-cup-hot-fill"></i>
                    Cafetería
                </button>
                <button class="nav-btn featured-filter" type="button">
                    <span class="svg vegetable-icon"></span>
                    Verdulería
                </button>
                <button class="nav-btn featured-filter" type="button">
                    <i class="bi bi-three-dots"></i>
                    Otras
                </button>
            </div>
        </header>
        <div id="middle-order">
            <label class="featured-order-label" for="featured-order">Ordenar por:</label>
            <div class="featured-order-control">
                <i class="bi bi-star" aria-hidden="true"></i>
                <select name="order" id="featured-order" class="featured-order-select">
                    <option value="rating">Valoración</option>
                </select>
            </div>
        </div>
        <section id="featured-card-container" aria-label="Listado de negocios destacados">
            <article class="featured-card border-card">
                <div class="featured-image">
                    <img
                    src="{{ url_for('static', filename='imgs/img-proto.png') }}"
                    alt="Imagen provisional del negocio destacado"
                    class="featured-banner"
                    >
                    <span class="rank rank-1" aria-label="Puesto provisional 1">1</span>
                </div>
                <div class="featured-card-content">
                    <img
                    src="{{ url_for('static', filename='imgs/default.jpg') }}"
                    alt="Foto de perfil predeterminada"
                    class="featured-profile"
                    >
                    <h2>(Nombre del negocio)</h2>
                    <div class="rating" aria-label="Valoración provisional: 4.6 de 5">
                        <span aria-hidden="true">★★★★★</span>
                        <strong>4.6</strong>
                    </div>
                    <span class="green-label featured-category">(Tipo)</span>
                    <div class="featured-location">
                        <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
                        <p>(Ubicación)</p>
                    </div>
                </div>
            </article>
        </section>
    </main>
    <!-- Footer -->
    <footer class="web-footer">
        <div class="footer-brand">
            <img src="{{ url_for('static', filename='imgs/logo/Almaceb-HD-Logo.png') }}" alt="Almaceb RED Logo">
            <p>Conectando negocios de barrio con clientes reales.</p>
        </div>
        <div class="footer-column">
            <h4>Enlaces</h4>
            <a href="/">Inicio</a>
        </div>
        <div class="footer-column">
            <h4>Proyecto</h4>
            <p>IntelliRED SpA</p>
            <p>Feria Técnico Profesional 2026</p>
            <p>© 2026 Almaceb RED</p>
        </div>
    </footer>
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
